name: Complete Test

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    strategy:
      # Default value means that a failure in one OS cancels all
      fail-fast: false
      matrix:
        smalltalk: [ Pharo64-alpha ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.smalltalk }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - run: smalltalkci -s ${{ matrix.smalltalk }}
        shell: bash
        timeout-minutes: 20
        env:
          # Skip the tests that Pharo's own CI skips with TestCase>>skipOnPharoCITestingEnvironment, such as the ones failing on Windows
          PHARO_CI_TESTING_ENVIRONMENT: true
